name: Refresh profile

on:
  schedule:
    # Daily at 03:17 UTC (08:47 India Standard Time).
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate profile application
        run: |
          npm run lint
          npm run build
      - name: Record completed daily maintenance
        shell: bash
        run: |
          run_date="$(date -u +'%F')"
          activity_file="automation/daily-activity.md"

          if [[ -f "$activity_file" ]] && grep -Fqx -- "- $run_date: UTC scheduled profile maintenance completed." "$activity_file"; then
            echo "Daily maintenance was already recorded for $run_date."
            exit 0
          fi

          mkdir -p automation
          if [[ ! -f "$activity_file" ]]; then
            cat > "$activity_file" <<'EOF'
          # Daily automation activity

          This log records successful UTC runs of the profile maintenance workflow.
          EOF
          fi

          printf '\n- %s: UTC scheduled profile maintenance completed.\n' "$run_date" >> "$activity_file"
          git add "$activity_file"
          git -c user.name="Sarthak Sulkhlan" -c user.email="24cseds104@jssaten.ac.in" commit -m "chore: record daily profile maintenance for $run_date"
          git push
