name: Refresh profile

on:
  schedule:
    # Daily at 03:17 UTC (08:47 India Standard Time).
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build and verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run lint
          npm run build
      - name: Commit generated changes when needed
        shell: bash
        run: |
          git add README.md assets/*.svg assets/*.gif assets/*.png assets/profile-data.json
          if git diff --cached --quiet; then
            echo "Generated profile is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh GitHub profile"
          git push
