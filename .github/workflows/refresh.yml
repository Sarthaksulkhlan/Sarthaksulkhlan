name: Refresh profile

on:
  schedule:
    # Daily at 03:17 UTC (08:47 India Standard Time).
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh profile from public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py
      - name: Verify generated output
        run: python scripts/verify_readme.py
      - name: Commit generated changes when needed
        shell: bash
        run: |
          git add README.md assets/*.svg assets/*.gif assets/*.png assets/profile-data.json
          if git diff --cached --quiet; then
            echo "Generated profile is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh GitHub profile"
          git push
