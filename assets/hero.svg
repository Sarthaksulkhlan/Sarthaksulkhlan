<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-labelledby="title desc">
  <title id="title">Sarthak Sulkhlan — B.Tech CSE (Data Science) · Applied AI · Software Systems</title>
  <desc id="desc">Hero terminal banner for Sarthak Sulkhlan with breadcrumb, online status, typewriter prompt and glowing accent beam.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0F"/>
      <stop offset="60%" stop-color="#0D1214"/>
      <stop offset="100%" stop-color="#101B1D"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5A3" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#47B68D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1B3937" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.15); }
      }
      @keyframes beamSlide {
        0% { transform: translateX(-100px); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateX(600px); opacity: 0.1; }
      }
      .cursor {
        animation: blink 0.9s infinite;
      }
      .pulse-dot {
        transform-origin: 776px 42px;
        animation: pulse 2s ease-in-out infinite;
      }
      .beam-shimmer {
        animation: beamSlide 4s linear infinite;
      }
      .mono {
        font-family: 'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners and Subtle Border -->
  <rect x="1" y="1" width="828" height="298" rx="20" fill="url(#bg)" stroke="#1B3937" stroke-width="1.5"/>

  <!-- Top File Path Breadcrumb (matching Screenshot 192221.png: vighriday / README.md) -->
  <g class="mono" font-size="12">
    <text x="36" y="44" fill="#8DE0C1" font-weight="600">Sarthaksulkhlan</text>
    <text x="146" y="44" fill="#4B635B">/</text>
    <text x="160" y="44" fill="#B3C3BE">README.md</text>
  </g>

  <!-- Top Right ONLINE Status with Glowing Indicator -->
  <g class="mono">
    <text x="712" y="45" fill="#8DE0C1" font-size="11" font-weight="700" letter-spacing="1.5">ONLINE</text>
    <circle class="pulse-dot" cx="776" cy="41" r="5" fill="#00E5A3" filter="url(#glow)"/>
    <circle cx="776" cy="41" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Subtle Horizontal Divider below header -->
  <line x1="36" y1="62" x2="794" y2="62" stroke="#1B3937" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Bold Main Name: Sarthak Sulkhlan -->
  <text x="36" y="132" fill="#F0F3EE" class="sans" font-size="46" font-weight="800" letter-spacing="-1">Sarthak Sulkhlan</text>

  <!-- Subtitle: B.TECH CSE (DATA SCIENCE) · APPLIED AI · SOFTWARE SYSTEMS -->
  <g class="mono" font-size="12" font-weight="600" letter-spacing="2">
    <text x="36" y="165" fill="#8DE0C1">B.TECH CSE (DATA SCIENCE)</text>
    <text x="264" y="165" fill="#285047">·</text>
    <text x="282" y="165" fill="#8DE0C1">APPLIED AI</text>
    <text x="382" y="165" fill="#285047">·</text>
    <text x="400" y="165" fill="#8DE0C1">SOFTWARE SYSTEMS</text>
  </g>

  <!-- Sleek Glowing Separator Line below Subtitle -->
  <g>
    <rect x="36" y="184" width="758" height="2" fill="#14272A" rx="1"/>
    <rect x="36" y="184" width="460" height="2" fill="url(#beam)" rx="1"/>
    <circle cx="496" cy="185" r="2.5" fill="#00E5A3" filter="url(#glow)"/>
  </g>

  <!-- Terminal Typewriter Prompt Area matching Screenshot 192221.png: "» Evidence be█" -->
  <g class="mono">
    <text x="36" y="235" fill="#8DE0C1" font-size="20" font-weight="700">»</text>
    <text x="60" y="235" fill="#F0F3EE" font-size="15" font-weight="500">From ideas to practical software, end to end.</text>
    <!-- Blinking Solid Block Cursor -->
    <rect class="cursor" x="466" y="221" width="9" height="17" fill="#00E5A3"/>
  </g>

  <!-- Bottom Tagline / Repository Metrics Pill -->
  <g class="mono" font-size="10">
    <text x="36" y="272" fill="#7E9A92" letter-spacing="1">OBSERVABLE SYSTEMS</text>
    <text x="180" y="272" fill="#285047">·</text>
    <text x="194" y="272" fill="#7E9A92" letter-spacing="1">DATA PIPELINES</text>
    <text x="306" y="272" fill="#285047">·</text>
    <text x="320" y="272" fill="#7E9A92" letter-spacing="1">GOVERNED AI</text>
    
    <text x="794" y="272" text-anchor="end" fill="#8DE0C1" font-weight="600">github.com/Sarthaksulkhlan</text>
  </g>
</svg>
