<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Sarthak Sulkhlan — B.Tech CSE (Data Science) · Applied AI · Software Systems</title>
  <desc id="hero-desc">Interactive profile terminal hero with bold typography, animated status indicator, typewriter effect, and moving horizontal sweep highlight below the subtitle.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0F"/>
      <stop offset="50%" stop-color="#0D1214"/>
      <stop offset="100%" stop-color="#101B1D"/>
    </linearGradient>
    <linearGradient id="sweep-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3937" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5A3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#47B68D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9E0DA"/>
    </linearGradient>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Container Box with Dark Graphite Aesthetic -->
  <rect x="1" y="1" width="828" height="298" rx="18" fill="url(#hero-bg)" stroke="#1B3937" stroke-width="1.5"/>

  <!-- Subtle Animated Background Ambient Glow -->
  <circle cx="415" cy="150" r="160" fill="#00E5A3" opacity="0.035">
    <animate attributeName="r" values="160;210;160" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.035;0.07;0.035" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Top Breadcrumb (matching Screenshot 192221.png: vighriday / README.md) -->
  <g class="mono" font-size="12">
    <text x="36" y="44" fill="#8DE0C1" font-weight="600">Sarthaksulkhlan</text>
    <text x="146" y="44" fill="#4B635B">/</text>
    <text x="160" y="44" fill="#B3C3BE">README.md</text>
  </g>

  <!-- Status Indicator: ONLINE with SMIL Pulsating Dot -->
  <g class="mono">
    <text x="714" y="45" fill="#8DE0C1" font-size="11" font-weight="700" letter-spacing="1.5">ONLINE</text>
    <!-- Animated outer pulse ring -->
    <circle cx="778" cy="41" r="5" fill="#00E5A3" opacity="0.5">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Core indicator dot -->
    <circle cx="778" cy="41" r="3.5" fill="#00E5A3" filter="url(#glow-teal)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle Horizontal Divider below header -->
  <line x1="36" y1="62" x2="794" y2="62" stroke="#1B3937" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Prominent Bold Name: Sarthak Sulkhlan -->
  <text x="36" y="132" fill="url(#text-gradient)" class="sans" font-size="46" font-weight="800" letter-spacing="-1">Sarthak Sulkhlan</text>

  <!-- Role / Tagline: B.TECH CSE (DATA SCIENCE) · APPLIED AI · SOFTWARE SYSTEMS -->
  <g class="mono" font-size="12" font-weight="600" letter-spacing="2">
    <text x="36" y="165" fill="#8DE0C1">B.TECH CSE (DATA SCIENCE)</text>
    <text x="264" y="165" fill="#285047">·</text>
    <text x="282" y="165" fill="#8DE0C1">APPLIED AI</text>
    <text x="382" y="165" fill="#285047">·</text>
    <text x="400" y="165" fill="#8DE0C1">SOFTWARE SYSTEMS</text>
  </g>

  <!-- Animated Horizontal Highlight Line BELOW Subtitle (never crossing name) -->
  <g>
    <!-- Background track -->
    <rect x="36" y="184" width="758" height="2" fill="#14272A" rx="1"/>
    <!-- Animated moving light sweep -->
    <rect x="36" y="183.5" width="160" height="3" fill="url(#sweep-beam)" rx="1.5">
      <animate attributeName="x" values="36;634;36" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Terminal Typewriter Effect: Prompt » with cycling text and blinking block cursor -->
  <g class="mono">
    <text x="36" y="235" fill="#8DE0C1" font-size="20" font-weight="700">»</text>
    <!-- Primary Focus Line (Static and animated fallback) -->
    <text x="60" y="235" fill="#F0F3EE" font-size="15" font-weight="500">From ideas to practical software, end to end.</text>
    <!-- Solid Blinking Block Cursor via SMIL -->
    <rect x="466" y="220" width="9" height="18" fill="#00E5A3">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom Tagline / Repository Metrics -->
  <g class="mono" font-size="10">
    <text x="36" y="272" fill="#7E9A92" letter-spacing="1">OBSERVABLE SYSTEMS</text>
    <text x="180" y="272" fill="#285047">·</text>
    <text x="194" y="272" fill="#7E9A92" letter-spacing="1">DATA PIPELINES</text>
    <text x="306" y="272" fill="#285047">·</text>
    <text x="320" y="272" fill="#7E9A92" letter-spacing="1">GOVERNED AI</text>
    <text x="794" y="272" text-anchor="end" fill="#8DE0C1" font-weight="600">github.com/Sarthaksulkhlan</text>
  </g>
</svg>
