<svg xmlns="http://www.w3.org/2000/svg" width="830" height="660" viewBox="0 0 830 660" role="img" aria-labelledby="ca-title ca-desc">
  <title id="ca-title">Sarthak Sulkhlan — Contribution Art, Snake &amp; Pac-Man</title>
  <desc id="ca-desc">Decorative Snake and Pac-Man maze art journeys over a verified GitHub contribution grid with live moving animations.</desc>
  <defs>
    <linearGradient id="ca-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0F"/>
      <stop offset="100%" stop-color="#101B1D"/>
    </linearGradient>
    <filter id="glow-mint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Top Timeline Scrubber -->
  <g class="mono" font-size="10" fill="#7E9A92" opacity="0.6">
    <text x="4" y="16">— · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · · ·</text>
    <circle cx="280" cy="13" r="4.5" fill="#00E5A3" filter="url(#glow-mint)"/>
    <circle cx="280" cy="13" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Section Title -->
  <text x="4" y="52" fill="#F0F3EE" class="sans" font-size="28" font-weight="800">Contribution art</text>
  <line x1="4" y1="66" x2="826" y2="66" stroke="#1B3937" stroke-width="1.2"/>

  <!-- ================= 1. SNAKE PATH CONTAINER ================= -->
  <g transform="translate(0, 84)">
    <rect width="830" height="195" rx="16" fill="url(#ca-card)" stroke="#1B3937" stroke-width="1.2"/>

    <!-- Grid Cells (52 cols x 7 rows) -->
    <g transform="translate(24, 24)">
      <!-- Render grid pattern with sampled commits -->
      <g fill="#0D1618">
        <path d="
          M0 0h11v11H0zM15 0h11v11H15zM30 0h11v11H30zM45 0h11v11H45zM60 0h11v11H60zM75 0h11v11H75zM90 0h11v11H90zM105 0h11v11H105zM120 0h11v11H120zM135 0h11v11H135zM150 0h11v11H150zM165 0h11v11H165zM180 0h11v11H180zM195 0h11v11H195zM210 0h11v11H210zM225 0h11v11H225zM240 0h11v11H240zM255 0h11v11H255zM270 0h11v11H270zM285 0h11v11H285zM300 0h11v11H300zM315 0h11v11H315zM330 0h11v11H330zM345 0h11v11H345zM360 0h11v11H360zM375 0h11v11H375zM390 0h11v11H390zM405 0h11v11H405zM420 0h11v11H420zM435 0h11v11H435zM450 0h11v11H450zM465 0h11v11H465zM480 0h11v11H480zM495 0h11v11H495zM510 0h11v11H510zM525 0h11v11H525zM540 0h11v11H540zM555 0h11v11H555zM570 0h11v11H570zM585 0h11v11H585zM600 0h11v11H600zM615 0h11v11H615zM630 0h11v11H630zM645 0h11v11H645zM660 0h11v11H660zM675 0h11v11H675zM690 0h11v11H690zM705 0h11v11H705zM720 0h11v11H720zM735 0h11v11H735zM750 0h11v11H750zM765 0h11v11H765z
        "/>
      </g>

      <!-- Active Green/Teal Contribution Cells -->
      <g fill="#1B5448">
        <rect x="0" y="30" width="11" height="11" rx="2" fill="#237865"/>
        <rect x="0" y="45" width="11" height="11" rx="2" fill="#47B68D"/>
        <rect x="15" y="15" width="11" height="11" rx="2"/>
        <rect x="450" y="15" width="11" height="11" rx="2"/>
        <rect x="465" y="30" width="11" height="11" rx="2" fill="#237865"/>
        <rect x="465" y="45" width="11" height="11" rx="2" fill="#47B68D"/>
        <rect x="525" y="0" width="11" height="11" rx="2" fill="#00E5A3"/>
        <rect x="540" y="0" width="11" height="11" rx="2" fill="#00E5A3"/>
        <rect x="555" y="0" width="11" height="11" rx="2" fill="#00E5A3"/>
        <rect x="540" y="15" width="11" height="11" rx="2" fill="#47B68D"/>
        <rect x="540" y="30" width="11" height="11" rx="2" fill="#237865"/>
        <rect x="540" y="45" width="11" height="11" rx="2" fill="#237865"/>
        <rect x="540" y="60" width="11" height="11" rx="2" fill="#237865"/>
        <rect x="630" y="0" width="11" height="11" rx="2" fill="#00E5A3"/>
        <rect x="690" y="30" width="11" height="11" rx="2" fill="#00E5A3"/>
        <rect x="690" y="60" width="11" height="11" rx="2" fill="#47B68D"/>
        <rect x="735" y="0" width="11" height="11" rx="2" fill="#00E5A3"/>
      </g>

      <!-- LIVE MOVING SNAKE PATH with SMIL Animation -->
      <g id="live-snake">
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 45,0; 45,30; 90,30; 90,-15; 135,-15; 135,15; 0,15; 0,0"
          keyTimes="0; 0.15; 0.3; 0.45; 0.6; 0.75; 0.85; 0.95; 1"
          dur="7s" repeatCount="indefinite" />
        <!-- Head -->
        <rect x="465" y="15" width="11" height="11" rx="3.5" fill="#00E5A3" filter="url(#glow-mint)"/>
        <circle cx="469" cy="18" r="1.2" fill="#080D0F"/>
        <circle cx="473" cy="18" r="1.2" fill="#080D0F"/>
        <!-- Body Segments -->
        <rect x="450" y="15" width="11" height="11" rx="3" fill="#8DE0C1"/>
        <rect x="435" y="15" width="11" height="11" rx="3" fill="#47B68D"/>
        <rect x="420" y="15" width="11" height="11" rx="3" fill="#237865"/>
        <rect x="405" y="15" width="11" height="11" rx="2.5" fill="#1B5448"/>
      </g>

      <!-- Glowing Food Pellet -->
      <rect x="540" y="15" width="11" height="11" rx="3" fill="#FFFFFF" filter="url(#glow-mint)">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Scrubber Progress Bar animating -->
    <g transform="translate(24, 155)">
      <rect width="782" height="6" rx="3" fill="#14272A"/>
      <rect width="240" height="6" rx="3" fill="#00E5A3">
        <animate attributeName="width" values="120; 680; 120" dur="7s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- ================= 2. PAC-MAN SECTION WITH 5 MOVING CHARACTERS ================= -->
  <g transform="translate(0, 305)">
    <text x="4" y="20" fill="#F0F3EE" class="sans" font-size="16" font-weight="700">▼ Pac-Man — the contribution graph, played</text>

    <!-- Month Labels -->
    <g class="mono" font-size="10" fill="#7E9A92" opacity="0.8">
      <text x="24" y="46">Oct</text>
      <text x="86" y="46">Nov</text>
      <text x="148" y="46">Dec</text>
      <text x="210" y="46">Jan</text>
      <text x="272" y="46">Feb</text>
      <text x="334" y="46">Mar</text>
      <text x="396" y="46">Apr</text>
      <text x="458" y="46">May</text>
      <text x="520" y="46">Jun</text>
      <text x="582" y="46">Jul</text>
      <text x="644" y="46">Aug</text>
      <text x="706" y="46">Sep</text>
      <text x="768" y="46">Oct</text>
    </g>

    <!-- Pac-Man Game Board Card -->
    <g transform="translate(0, 56)">
      <rect width="830" height="175" rx="16" fill="url(#ca-card)" stroke="#1B3937" stroke-width="1.2"/>

      <g transform="translate(24, 20)">
        <!-- Green density blocks on corners -->
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#237865"/>
        <rect x="0" y="16" width="12" height="12" rx="2" fill="#47B68D"/>
        <rect x="0" y="48" width="12" height="12" rx="2" fill="#237865"/>
        <rect x="330" y="32" width="12" height="12" rx="2" fill="#47B68D"/>
        <rect x="420" y="0" width="12" height="12" rx="2" fill="#47B68D"/>
        <rect x="540" y="80" width="12" height="12" rx="2" fill="#237865"/>
        <rect x="640" y="0" width="12" height="12" rx="2" fill="#00E5A3"/>
        <rect x="656" y="0" width="12" height="12" rx="2" fill="#00E5A3"/>
        <rect x="672" y="0" width="12" height="12" rx="2" fill="#00E5A3"/>
        <rect x="750" y="96" width="12" height="12" rx="2" fill="#237865"/>
        <rect x="766" y="96" width="12" height="12" rx="2" fill="#237865"/>

        <!-- Crisp White Maze Lines -->
        <g stroke="#F0F3EE" stroke-width="2.2" stroke-linecap="round" fill="none">
          <path d="M0 24 h 30 v 55 h -30"/>
          <path d="M45 10 v 40 h 45"/>
          <path d="M105 10 h 75 v 45 h -75 v 40 h 75"/>
          <path d="M205 10 h 55 v 45 h -30 v 35"/>
          <path d="M285 24 h 45 v 40"/>
          <path d="M310 90 v -25 h 35 v 25"/>
          <!-- Ghost Pen (Center) -->
          <path d="M390 40 h 50 v 35 h -50 Z"/>
          <path d="M450 10 h 45 v 55 h 45"/>
          <path d="M520 85 v -25 h 45 v 25"/>
          <path d="M570 30 h 45 v 55"/>
          <path d="M635 10 h 65 v 50 h -65"/>
          <path d="M715 80 h 25 v -40 h 30"/>
          <path d="M740 60 h 35"/>
          <path d="M740 95 h 35"/>
        </g>

        <!-- LIVE ANIMATED PAC-MAN (Character 1) -->
        <g transform="translate(470, 95)">
          <animateTransform attributeName="transform" type="translate"
            values="470,95; 580,95; 580,55; 720,55; 580,55; 470,95"
            dur="9s" repeatCount="indefinite" />
          <path d="M 0 0 L 8 -5 A 9 9 0 1 0 8 5 Z" fill="#FACC15" filter="url(#glow-mint)">
            <animate attributeName="d"
              values="M 0 0 L 8 -5 A 9 9 0 1 0 8 5 Z; M 0 0 L 9 -1 A 9 9 0 1 0 9 1 Z; M 0 0 L 8 -5 A 9 9 0 1 0 8 5 Z"
              dur="0.3s" repeatCount="indefinite" />
          </path>
          <circle cx="1" cy="-4" r="1.1" fill="#080D0F"/>
        </g>

        <!-- LIVE ANIMATED GHOST 1: Blinky (Red) -->
        <g transform="translate(450, 10)">
          <animateTransform attributeName="transform" type="translate"
            values="450,10; 340,10; 340,55; 450,55; 450,10"
            dur="8s" repeatCount="indefinite" />
          <path d="M-6 -6 A6 6 0 0 1 6 -6 V4 L3 1 L0 4 L-3 1 L-6 4 Z" fill="#EF4444"/>
          <circle cx="-2" cy="-4" r="1.5" fill="#FFFFFF"/>
          <circle cx="2" cy="-4" r="1.5" fill="#FFFFFF"/>
          <circle cx="-1" cy="-4" r="0.7" fill="#1E3A8A"/>
          <circle cx="3" cy="-4" r="0.7" fill="#1E3A8A"/>
        </g>

        <!-- LIVE ANIMATED GHOST 2: Inky (Cyan) -->
        <g transform="translate(402, 58)">
          <animateTransform attributeName="transform" type="translate"
            values="402,58; 260,58; 260,95; 402,95; 402,58"
            dur="9s" repeatCount="indefinite" />
          <path d="M-6 -6 A6 6 0 0 1 6 -6 V4 L3 1 L0 4 L-3 1 L-6 4 Z" fill="#38BDF8"/>
          <circle cx="-2" cy="-4" r="1.5" fill="#FFFFFF"/>
          <circle cx="2" cy="-4" r="1.5" fill="#FFFFFF"/>
          <circle cx="-2" cy="-4" r="0.7" fill="#1E3A8A"/>
          <circle cx="2" cy="-4" r="0.7" fill="#1E3A8A"/>
        </g>

        <!-- LIVE ANIMATED GHOST 3: Pinky (Pink) -->
        <g transform="translate(415, 58)">
          <animateTransform attributeName="transform" type="translate"
            values="415,58; 415,15; 530,15; 530,58; 415,58"
            dur="7.5s" repeatCount="indefinite" />
          <path d="M-6 -6 A6 6 0 0 1 6 -6 V4 L3 1 L0 4 L-3 1 L-6 4 Z" fill="#F472B6"/>
          <circle cx="-2" cy="-4" r="1.5" fill="#FFFFFF"/>
          <circle cx="2" cy="-4" r="1.5" fill="#FFFFFF"/>
          <circle cx="-2" cy="-4" r="0.7" fill="#1E3A8A"/>
          <circle cx="2" cy="-4" r="0.7" fill="#1E3A8A"/>
        </g>

        <!-- LIVE ANIMATED GHOST 4: Clyde (Orange) -->
        <g transform="translate(428, 58)">
          <animateTransform attributeName="transform" type="translate"
            values="428,58; 590,58; 590,95; 428,95; 428,58"
            dur="8.5s" repeatCount="indefinite" />
          <path d="M-6 -6 A6 6 0 0 1 6 -6 V4 L3 1 L0 4 L-3 1 L-6 4 Z" fill="#FB923C"/>
          <circle cx="-2" cy="-4" r="1.5" fill="#FFFFFF"/>
          <circle cx="2" cy="-4" r="1.5" fill="#FFFFFF"/>
          <circle cx="-2" cy="-4" r="0.7" fill="#1E3A8A"/>
          <circle cx="2" cy="-4" r="0.7" fill="#1E3A8A"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= 3. ISOMETRIC YEAR PREVIEW ================= -->
  <g transform="translate(4, 595)">
    <text x="0" y="20" fill="#F0F3EE" class="sans" font-size="16" font-weight="700">▶ Isometric year — contributions in 3D</text>
    <text x="0" y="42" fill="#7E9A92" class="mono" font-size="11">Available interactively in the Profile Studio preview (spatial 3D projection of commit elevation)</text>
  </g>
</svg>
