        <rect x="525" y="0" width="11" height="11" rx="2" fill="#147B61"/>
        <rect x="540" y="0" width="11" height="11" rx="2" fill="#147B61"/>
        <rect x="555" y="0" width="11" height="11" rx="2" fill="#147B61"/>
        <rect x="630" y="0" width="11" height="11" rx="2" fill="#147B61"/>
        <rect x="690" y="30" width="11" height="11" rx="2" fill="#147B61"/>
      </g>
      <g>
        <rect x="450" y="45" width="11" height="11" rx="3" fill="#147B61"/>
        <rect x="465" y="45" width="11" height="11" rx="3" fill="#0D604B"/>
        <rect x="465" y="30" width="11" height="11" rx="3" fill="#0D604B"/>
        <rect x="465" y="15" width="11" height="11" rx="3" fill="#0D604B"/>
        <rect x="480" y="15" width="11" height="11" rx="4" fill="#0D604B"/>
