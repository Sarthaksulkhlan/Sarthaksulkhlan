<svg xmlns="http://www.w3.org/2000/svg" width="830" height="660" viewBox="0 0 830 660" role="img" aria-labelledby="ca-light-title ca-light-desc">
  <title id="ca-light-title">Sarthak Sulkhlan — Contribution Art, Snake &amp; Pac-Man (Light)</title>
  <desc id="ca-light-desc">Decorative Snake and Pac-Man maze art journeys over a verified GitHub contribution grid in light theme.</desc>
  <defs>
    <linearGradient id="ca-card-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F8F6"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
