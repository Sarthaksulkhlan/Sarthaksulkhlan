<svg xmlns="http://www.w3.org/2000/svg" width="830" height="210" viewBox="0 0 830 210" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><title id="title">Selected project landscape</title><desc id="desc">A map of three documented projects and the software domains they address: software evolution, endpoint telemetry, and voice interaction.</desc><rect x=".5" y=".5" width="829" height="209" rx="15" fill="#F3F7F3" stroke="#CED9D1"/><text x="24" y="27" fill="#52655A" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1.5">PROJECT LANDSCAPE / THREE DIFFERENT SYSTEMS</text><text x="26" y="59" fill="#176C4D" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1">01</text><rect x="58" y="42" width="235" height="34" rx="8" fill="#FFFFFF" stroke="#CED9D1"/><text x="72" y="55" fill="#1B2922" font-size="12" font-weight="600">EPOCH</text><text x="72" y="69" fill="#52655A" font-size="10">change → invariants → review</text><path d="M293 59H367" stroke="#176C4D" stroke-width="1.4" opacity=".8"/><circle cx="367" cy="59" r="3" fill="#2F8A66"/><text x="390" y="63" fill="#50645A" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing=".8">SYSTEM EVOLUTION</text><text x="26" y="106" fill="#176C4D" font-family="SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1">02</text><rect x="58" y="89" width="235" height="34" rx="8" fill="#FFFFFF" stroke="#CED9D1"/><text x="72" y="102" fill="#1B2922" font-size="12" font-weight="600">ASSET SENTINEL</text><text x="72" y="116" fill="#52655A" font-size="10">devices → telemetry → operations</text><path d="M293 106H367" stroke="#176C4D" stroke-width="1.4" opacity=".8"/><circle cx="367" cy="106" r="3" fill="#2F8A66"/><text x="390" y="110" fill="#50645A" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing=".8">ENDPOINT TELEMETRY</text><text x="26" y="153" fill="#176C4D" f