<svg xmlns="http://www.w3.org/2000/svg" width="830" height="735" viewBox="0 0 830 735" role="img" aria-labelledby="tel-title tel-desc">
  <title id="tel-title">Sarthak Sulkhlan — Telemetry &amp; GitHub Analytics</title>
  <desc id="tel-desc">Comprehensive telemetry dashboard showing GitHub statistics, language mix by bytes with live animating bars, contribution streaks, and 31-day activity trace.</desc>
  <defs>
    <linearGradient id="card-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0F"/>
      <stop offset="100%" stop-color="#101B1D"/>
    </linearGradient>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Section Title & Last Updated Timestamp -->
  <text x="4" y="32" fill="#F0F3EE" class="sans" font-size="28" font-weight="800">Telemetry</text>
  <text x="826" y="32" text-anchor="end" fill="#7E9A92" class="mono" font-size="11">Updated: 2026-10-12 13:26:37 UTC</text>

  <!-- ================= TOP ROW: 2 CARDS ================= -->
  <!-- 1. GITHUB STATISTICS (Left Card) -->
  <g transform="translate(0, 52)">
    <rect width="405" height="236" rx="16" fill="url(#card-dark)" stroke="#1B3937" stroke-width="1.2"/>
    <text x="24" y="32" fill="#7E9A92" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">GITHUB STATISTICS</text>
    <line x1="24" y1="44" x2="381" y2="44" stroke="#1B3937" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="24" y="86" fill="#8DE0C1" class="mono" font-size="28" font-weight="800">2</text>
    <text x="24" y="103" fill="#7E9A92" class="mono" font-size="9" font-weight="600" letter-spacing="1">TOTAL STARS</text>

    <text x="210" y="86" fill="#8DE0C1" class="mono" font-size="28" font-weight="800">1,154</text>
    <text x="210" y="103" fill="#7E9A92" class="mono" font-size="9" font-weight="600" letter-spacing="1">CONTRIBUTIONS</text>

    <!-- Row 2 -->
    <text x="24" y="148" fill="#8DE0C1" class="mono" font-size="28" font-weight="800">4</text>
    <text x="24" y="165" fill="#7E9A92" class="mono" font-size="9" font-weight="600" letter-spacing="1">PUBLIC REPOS</text>

    <text x="210" y="148" fill="#8DE0C1" class="mono" font-size="28" font-weight="800">0</text>
    <text x="210" y="165" fill="#7E9A92" class="mono" font-size="9" font-weight="600" letter-spacing="1">FOLLOWERS</text>

    <!-- Row 3 -->
    <text x="24" y="208" fill="#8DE0C1" class="mono" font-size="28" font-weight="800">6</text>
    <text x="24" y="222" fill="#7E9A92" class="mono" font-size="9" font-weight="600" letter-spacing="1">PULL REQUESTS</text>

    <text x="210" y="208" fill="#8DE0C1" class="mono" font-size="28" font-weight="800">1,242</text>
    <text x="210" y="222" fill="#7E9A92" class="mono" font-size="9" font-weight="600" letter-spacing="1">COMMITS</text>
  </g>

  <!-- 2. LANGUAGE MIX / BY BYTES with Animated Bars (Right Card) -->
  <g transform="translate(425, 52)">
    <rect width="405" height="236" rx="16" fill="url(#card-dark)" stroke="#1B3937" stroke-width="1.2"/>
    <text x="24" y="32" fill="#7E9A92" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">LANGUAGE MIX / BY BYTES</text>
    <line x1="24" y1="44" x2="381" y2="44" stroke="#1B3937" stroke-width="1"/>

    <!-- TypeScript (Animates from zero to 77.7% / 170px width) -->
    <g transform="translate(24, 56)" class="mono" font-size="11">
      <text x="0" y="18" fill="#F0F3EE" font-weight="600">TypeScript</text>
      <rect x="94" y="6" width="220" height="15" rx="7.5" fill="#14272A"/>
      <rect x="94" y="6" width="170" height="15" rx="7.5" fill="#00E5A3">
        <animate attributeName="width" values="0; 170; 170; 170" keyTimes="0; 0.28; 0.9; 1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="357" y="18" text-anchor="end" fill="#8DE0C1" font-weight="700">77.7%</text>
    </g>

    <!-- Python (Animates from zero to 20.3% / 45px width) -->
    <g transform="translate(24, 88)" class="mono" font-size="11">
      <text x="0" y="18" fill="#F0F3EE" font-weight="600">Python</text>
      <rect x="94" y="6" width="220" height="15" rx="7.5" fill="#14272A"/>
      <rect x="94" y="6" width="45" height="15" rx="7.5" fill="#47B68D">
        <animate attributeName="width" values="0; 45; 45; 45" keyTimes="0; 0.28; 0.9; 1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="357" y="18" text-anchor="end" fill="#8DE0C1" font-weight="700">20.3%</text>
    </g>

    <!-- CSS (Animates from zero to 1.5% / 16px width) -->
    <g transform="translate(24, 120)" class="mono" font-size="11">
      <text x="0" y="18" fill="#F0F3EE" font-weight="600">CSS</text>
      <rect x="94" y="6" width="220" height="15" rx="7.5" fill="#14272A"/>
      <rect x="94" y="6" width="16" height="15" rx="7.5" fill="#8DE0C1">
        <animate attributeName="width" values="0; 16; 16; 16" keyTimes="0; 0.28; 0.9; 1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="357" y="18" text-anchor="end" fill="#8DE0C1" font-weight="700">1.5%</text>
    </g>

