<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-labelledby="title desc">
  <title id="title">Sarthak Sulkhlan — B.Tech CSE (Data Science) · Applied AI · Software Systems</title>
  <desc id="desc">Hero terminal banner for Sarthak Sulkhlan with breadcrumb, online status, typewriter prompt and glowing accent beam.</desc>
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F4F8F6"/>
      <stop offset="100%" stop-color="#E2F0EA"/>
    </linearGradient>
    <linearGradient id="beam-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D604B" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#147B61" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BAD6CB" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.15); }
      }
      .cursor {
        animation: blink 0.9s infinite;
      }
      .pulse-dot {
        transform-origin: 776px 42px;
        animation: pulse 2s ease-in-out infinite;
      }
      .mono {
        font-family: 'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners and Subtle Border -->
  <rect x="1" y="1" width="828" height="298" rx="20" fill="url(#bg-light)" stroke="#BAD6CB" stroke-width="1.5"/>

  <!-- Top File Path Breadcrumb -->
  <g class="mono" font-size="12">
    <text x="36" y="44" fill="#0D604B" font-weight="600">Sarthaksulkhlan</text>
    <text x="146" y="44" fill="#8CA69C">/</text>
    <text x="160" y="44" fill="#466058">README.md</text>
  </g>

  <!-- Top Right ONLINE Status -->
  <g class="mono">
    <text x="712" y="45" fill="#0D604B" font-size="11" font-weight="700" letter-spacing="1.5">ONLINE</text>
    <circle class="pulse-dot" cx="776" cy="41" r="5" fill="#0D604B"/>
    <circle cx="776" cy="41" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Horizontal Divider -->
  <line x1="36" y1="62" x2="794" y2="62" stroke="#BAD6CB" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Bold Main Name: Sarthak Sulkhlan -->
  <text x="36" y="132" fill="#11231F" class="sans" font-size="46" font-weight="800" letter-spacing="-1">Sarthak Sulkhlan</text>

  <!-- Subtitle -->
  <g class="mono" font-size="12" font-weight="600" letter-spacing="2">
    <text x="36" y="165" fill="#0D604B">B.TECH CSE (DATA SCIENCE)</text>
    <text x="264" y="165" fill="#BAD6CB">·</text>
    <text x="282" y="165" fill="#0D604B">APPLIED AI</text>
    <text x="382" y="165" fill="#BAD6CB">·</text>
    <text x="400" y="165" fill="#0D604B">SOFTWARE SYSTEMS</text>
  </g>

  <!-- Separator Line -->
  <g>
    <rect x="36" y="184" width="758" height="2" fill="#E2F0EA" rx="1"/>
    <rect x="36" y="184" width="460" height="2" fill="url(#beam-light)" rx="1"/>
    <circle cx="496" cy="185" r="2.5" fill="#0D604B"/>
  </g>

  <!-- Terminal Prompt -->
  <g class="mono">
    <text x="36" y="235" fill="#0D604B" font-size="20" font-weight="700">»</text>
    <text x="60" y="235" fill="#11231F" font-size="15" font-weight="500">From ideas to practical software, end to end.</text>
    <rect class="cursor" x="466" y="221" width="9" height="17" fill="#0D604B"/>
  </g>

  <!-- Bottom Tagline -->
  <g class="mono" font-size="10">
    <text x="36" y="272" fill="#5E7A71" letter-spacing="1">OBSERVABLE SYSTEMS</text>
    <text x="180" y="272" fill="#BAD6CB">·</text>
    <text x="194" y="272" fill="#5E7A71" letter-spacing="1">DATA PIPELINES</text>
    <text x="306" y="272" fill="#BAD6CB">·</text>
    <text x="320" y="272" fill="#5E7A71" letter-spacing="1">GOVERNED AI</text>
    <text x="794" y="272" text-anchor="end" fill="#0D604B" font-weight="600">github.com/Sarthaksulkhlan</text>
  </g>
</svg>
