<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-labelledby="hero-light-title hero-light-desc">
  <title id="hero-light-title">Sarthak Sulkhlan — B.Tech CSE (Data Science) · Applied AI · Software Systems (Light)</title>
  <desc id="hero-light-desc">Interactive profile terminal hero in light theme with bold typography, animated status indicator, typewriter effect, and moving horizontal sweep highlight below the subtitle.</desc>
  <defs>
    <linearGradient id="hero-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F4F8F6"/>
      <stop offset="100%" stop-color="#E2F0EA"/>
    </linearGradient>
    <linearGradient id="sweep-beam-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAD6CB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0D604B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#147B61" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <rect x="1" y="1" width="828" height="298" rx="18" fill="url(#hero-bg-light)" stroke="#BAD6CB" stroke-width="1.5"/>

  <!-- Top Breadcrumb -->
  <g class="mono" font-size="12">
    <text x="36" y="44" fill="#0D604B" font-weight="600">Sarthaksulkhlan</text>
    <text x="146" y="44" fill="#8CA69C">/</text>
    <text x="160" y="44" fill="#466058">README.md</text>
  </g>

  <!-- Status Indicator: ONLINE with SMIL Pulsating Dot -->
  <g class="mono">
    <text x="714" y="45" fill="#0D604B" font-size="11" font-weight="700" letter-spacing="1.5">ONLINE</text>
    <circle cx="778" cy="41" r="5" fill="#0D604B" opacity="0.4">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="778" cy="41" r="3.5" fill="#0D604B"/>
  </g>

  <line x1="36" y1="62" x2="794" y2="62" stroke="#BAD6CB" stroke-width="1" stroke-opacity="0.6"/>

  <text x="36" y="132" fill="#11231F" class="sans" font-size="46" font-weight="800" letter-spacing="-1">Sarthak Sulkhlan</text>

  <g class="mono" font-size="12" font-weight="600" letter-spacing="2">
    <text x="36" y="165" fill="#0D604B">B.TECH CSE (DATA SCIENCE)</text>
    <text x="264" y="165" fill="#BAD6CB">·</text>
    <text x="282" y="165" fill="#0D604B">APPLIED AI</text>
    <text x="382" y="165" fill="#BAD6CB">·</text>
    <text x="400" y="165" fill="#0D604B">SOFTWARE SYSTEMS</text>
  </g>

  <!-- Moving Highlight Line below Subtitle -->
  <g>
    <rect x="36" y="184" width="758" height="2" fill="#E2F0EA" rx="1"/>
    <rect x="36" y="183.5" width="160" height="3" fill="url(#sweep-beam-light)" rx="1.5">
      <animate attributeName="x" values="36;634;36" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="mono">
    <text x="36" y="235" fill="#0D604B" font-size="20" font-weight="700">»</text>
    <text x="60" y="235" fill="#11231F" font-size="15" font-weight="500">From ideas to practical software, end to end.</text>
    <rect x="466" y="220" width="9" height="18" fill="#0D604B">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="mono" font-size="10">
    <text x="36" y="272" fill="#5E7A71" letter-spacing="1">OBSERVABLE SYSTEMS</text>
    <text x="180" y="272" fill="#BAD6CB">·</text>
    <text x="194" y="272" fill="#5E7A71" letter-spacing="1">DATA PIPELINES</text>
    <text x="306" y="272" fill="#BAD6CB">·</text>
    <text x="320" y="272" fill="#5E7A71" letter-spacing="1">GOVERNED AI</text>
    <text x="794" y="272" text-anchor="end" fill="#0D604B" font-weight="600">github.com/Sarthaksulkhlan</text>
  </g>
</svg>
